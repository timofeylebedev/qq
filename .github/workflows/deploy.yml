# QQ (Nov 23, 2026): onto site-kit. The site job builds, runs QQ's own rules (build/rules.mjs: they still fail a pull
# request) and the html check, and publishes; the checks job measures the design system and builds the review page
# (QQ's settings: site-kit.config.mjs).
# Copy to the site's .github/workflows/deploy.yml. Builds the site and publishes it on GitHub Pages from one branch,
# with a preview for every pull request, then the design system's checks and the review page (site-kit, SPEC.md).
#   main                  → https://<owner>.github.io/<repo>/          (the review page at /report/)
#   pull request <n>      → https://<owner>.github.io/<repo>/pr-preview/pr-<n>/   (the link as a comment on the PR)
#   the label `checks`    → the pull request is measured even when no design file changed (adding it starts a run)
#   the label `shots`     → pictures of the pull request's changed blocks, in its preview's review page
#   Actions → Build and deploy → Run workflow → shots: all   → every block's pictures again (on main: kept)
#
# Once, in the repository's settings:
#   - Settings → Pages → Build and deployment → Source: "Deploy from a branch", branch gh-pages, folder / (root).
#     (The first run creates gh-pages; pick it then.)
#   - Settings → Actions → General → Workflow permissions: "Read and write permissions" (the jobs push to gh-pages and
#     report-data and comment on pull requests; the permissions below ask for exactly that).
#   - Issues → Labels: add `checks` and `shots` (any colour). To name them otherwise, change them in all three places
#     below: the concurrency group, the job `site`'s `if`, and the inputs checks-label / shots-label of the job `checks`.
#   - The site's package.json has "site-kit": "github:timofeylebedev/site-kit#<tag or commit>" in devDependencies, and its
#     adapter site-kit.config.mjs (checks.designPaths decides which pull requests are measured).
#   - Raise the kit's tag here and in package.json together.
name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, closed, labeled]
  workflow_dispatch:
    inputs:
      shots:
        description: pictures of the blocks
        type: choice
        options: [changed, all, none]
        default: changed

# One lane per pull request (by its number) and one per branch, so a pull request never cancels a deploy of main and a
# newer push cancels the older run of the same pull request. Not github.ref alone: when a pull request is merged, its
# "closed" run (the preview's removal) has the ref refs/heads/main, and it cancelled main's deploy that way (Flow
# Medium PR #59). A label other than `checks`/`shots` gets a lane of its own (its run does nothing), so adding it
# never cancels a preview that is being published.
concurrency:
  group: pages-${{ github.event.action == 'labeled' && !contains(fromJSON('["checks", "shots"]'), github.event.label.name) && format('label-{0}', github.run_id) || github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

jobs:
  site:
    if: github.event.action != 'labeled' || contains(fromJSON('["checks", "shots"]'), github.event.label.name)
    permissions:
      contents: write       # push to the gh-pages branch
      pull-requests: write  # the preview link comment
    uses: timofeylebedev/site-kit/.github/workflows/site.yml@98e270bb122cce7bf486a86fa8d16563b6de5d1d
    with:
      build: npm run build
      check: npm run rules && npm run check   # QQ's own rules (build/rules.mjs) still fail a pull request
    #   rules-strict: true    # a failing code rule (site-kit rules) stops the deploy; off by default

  checks:
    needs: site
    permissions:
      contents: write       # the report-data branch, the review page on gh-pages
      pull-requests: write  # the preview
    uses: timofeylebedev/site-kit/.github/workflows/checks.yml@98e270bb122cce7bf486a86fa8d16563b6de5d1d
    with:
      build: npm run build
      engines: chromium webkit:quick
      shots: ${{ inputs.shots || '' }}
      checks-label: checks  # the same names as in the concurrency group and the `if` above
      shots-label: shots
      timeout: 60           # QQ measures four pages at nine sizes (the kit's default is 40 minutes)
