# Checks every pull request in real browsers: `site-kit audit` (site-kit's .github/workflows/audit.yml; QQ's settings
# in site-kit.config.mjs, key `audit`; was build/audit.mjs, with nearly the same findings: PR #17 lists the differences)
# loads the home page, the catalog, two coffee pages and the pages of round 4 (the shop with a bag and favourites put
# into the browser first, the account, the information pages) at twelve screen sizes (a folded phone, phones upright
# and sideways, tablets, laptops short and tall, 1440, 1920, 2560, and a phone and a laptop with the browser's text
# at 24px) and fails on sideways scroll, cut-off text, text under 12px, tap targets under 24px, the navbar's sections
# running into the logo or the tools, the
# hero's countdown out of line with its caption, script errors and axe-core rules. Exceptions decided on purpose are in
# design/decisions.json (an exception with an `audit` field), each with its reason.
#
# Three engines: Chromium fails its check when a problem is found. Firefox and WebKit (Safari, every browser on iPhone)
# run too, but only warn (their check stays green, the problems are in its summary): they were added without a first
# run to compare with. Once they have come back clean a few times, add them to `fail-on` below to make them fail too.
# The kit's version is pinned here and in package.json ("site-kit"): raise both together, on purpose.
name: Responsive audit

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# one run per pull request (its ref is refs/pull/<n>/merge): a newer push cancels the older audit
concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    uses: timofeylebedev/site-kit/.github/workflows/audit.yml@v0.1.1
    with:
      build: npm run build
      engines: '["chromium", "firefox", "webkit"]'
      fail-on: '["chromium"]'
      timeout: 60           # 21 pages at twelve sizes: WebKit took 36 minutes (the kit's default is 20)
